<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>

<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .ecom{
        display: flex;
        justify-content: space-between;
        border-spacing: 0cap;
        flex-wrap: wrap;
    }
    .product{
        width: 300px;
        text-align: center;

        box-shadow: inset 180 180 0;
        box-sizing: border-box;
        border: 1px solid black;
        border-radius: 20px;
        margin: 20px;
        padding: 10px;
    }
    div img{
        width: 200px;
        height: 150px;
        margin-bottom: auto;
    }
    div h2{
        font-size: medium;
        text-decoration: dashed;
    }
    div p{
        font-family: 'Courier New', Courier, monospace;
        font-weight: 100;
    }
    div button{
        background-color: chocolate;
        border: 1px;
        padding: 10px;
        border-radius: 20px;
    }
</style>
<body>
    <div class="ecom">
    <div class="product">
